<!DOCTYPE html>
<html>
<head>
    <title>Employee Directory</title>
</head>
<body>
 <h1>Employee Directory</h1>

 <!-- Navigation -->
    <div style="margin-bottom: 20px;">
    <a href="index.html">Employee Directory</a> |
    <a href="clock.html">Time Clock</a> |
    <a href="holidays.html">Holidays</a> |
    <a href="payroll.html">Payroll</a> |
    <a href="data-management.html">Data Management</a>
</div>
    

    <!-- CHANGED: Framed as Company Setting -->
 <div id="idConfig" style="margin-bottom: 15px; padding: 10px; background: #f5f5f5; border: 1px solid #ddd;">
    <strong>Company Settings</strong><br>

    <label for="idMode">Employee ID Assignment:</label>

    <select id="idMode" onchange="setIDMode(this.value)">
        <option value="">Select ID Assignment</option>
        <option value="system">System Generated</option>
        <option value="manual">Company Assigned</option>
    </select>
</div>

<h2>Add Employee</h2>

<label for="employeeIdInput">Employee ID:</label>
<input
    type="text"
    id="employeeIdInput"
    placeholder="e.g. EMP1045 or KEN-00321"
    style="display: none; margin-bottom: 10px;"
>
    <div>
        <label for="name">Name:</label>
        <input type="text" id="name">
    </div>
    <div>
        <label for="telephone">Telephone:</label>
        <input
    type="tel"
    id="telephone"
    inputmode="numeric"
    placeholder="Enter telephone number"
>
    </div>
    <div>
        <label for="department">Department:</label>
<input
    type="text"
    id="department"
    list="departmentOptions"
    placeholder="Search department..."
>

<datalist id="departmentOptions">
    <option value="Production">
    <option value="Finance">
    <option value="Marketing">
    <option value="Warehousing">
    <option value="Procurement">
    <option value="Engineering">
</datalist>
    </div>
    <div>
        <label for="dailyRate">Daily Rate (KES):</label>
        <input type="number" id="dailyRate" value="800" min="0" placeholder="800">
    </div>
    <button onclick="addEmployee()">Add Employee</button>

    <h2>Search</h2>
    <input type="text" id="search" onkeyup="searchEmployees()" placeholder="Search employees...">

    <h2>Employee List</h2>
    <table id="employeeTable" border="1" cellpadding="5">
        <thead>
            <tr>
                <th>Employee ID</th>
                <th>Name</th>
                <th>Telephone</th>
                <th>Department</th>
                <th>Daily Rate</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

 
       <script src="employees.js"></script>
   
</body>
</html>
